<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-books - Rainbow Books</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hd" id="hd"></header>

<div class="page-h"><div class="wrap"><h1>E-books</h1><p>Read on your phone, tablet or e-reader. Every e-book has a free sample.</p></div></div>
<div class="wrap" style="padding-top:30px"><div class="filters"><div style="flex:2"><label for="q">Search e-books</label><input type="search" id="q" placeholder="Title or author"></div><div><label for="cat">Category</label><select id="cat"><option value="">All categories</option></select></div></div><div class="grid" id="grid"></div></div>
<div class="modal" id="md" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet"><h3 id="mt"></h3><p id="mb"></p><p style="margin-top:14px">The sample continues in the full e-book.</p><div style="margin-top:22px;display:flex;gap:10px"><button class="btn go" id="mbuy">Buy e-book</button><button class="btn" id="mc">Close</button></div></div></div>
<footer class="ft" id="ft"></footer>
<script src="app.js"></script><script>RB.init("ebooks");
var cs=document.getElementById("cat"),cats={};RB.BOOKS.forEach(function(b){cats[b.c]=1});Object.keys(cats).sort().forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;cs.appendChild(o)});
function draw(){var q=document.getElementById("q").value.toLowerCase(),c=cs.value;var r=RB.BOOKS.filter(function(b){return (!q||(b.t+" "+b.a).toLowerCase().indexOf(q)>-1)&&(!c||b.c==c)});
document.getElementById("grid").innerHTML=r.map(function(b){return '<div class="card"><a class="cv" href="book.html?id='+b.id+'">'+RB.cover(b)+'</a><h3>'+RB.esc(b.t)+'</h3><div class="by">'+RB.esc(b.a)+'</div><div class="price">'+RB.money(b.e)+' <span class="tag e" style="margin-left:6px">E-book</span></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" data-s="'+b.id+'" style="flex:1">Read sample</button><button class="btn ink sm" data-e="'+b.id+'" style="flex:1">Buy</button></div></div>'}).join("");
document.querySelectorAll("[data-e]").forEach(function(x){x.onclick=function(){RB.add(x.getAttribute("data-e"),"E-book",1)}});
document.querySelectorAll("[data-s]").forEach(function(x){x.onclick=function(){var b=RB.book(x.getAttribute("data-s"));document.getElementById("mt").textContent=b.t;document.getElementById("mb").textContent=b.d+" The first chapter opens on a grey morning, with the kettle on and the radio low, and nobody yet aware that the day will change everything.";document.getElementById("mbuy").onclick=function(){RB.add(b.id,"E-book",1);document.getElementById("md").classList.remove("open")};document.getElementById("md").classList.add("open");document.getElementById("mc").focus()}})}
document.getElementById("mc").onclick=function(){document.getElementById("md").classList.remove("open")};document.addEventListener("keydown",function(e){if(e.key=="Escape")document.getElementById("md").classList.remove("open")});
document.getElementById("q").oninput=draw;cs.onchange=draw;draw();</script></body></html>
