<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book - Rainbow Books</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hd" id="hd"></header>

<div class="wrap"><div class="crumb"><a href="index.html">Home</a> &gt; <a href="shop.html">Shop</a> &gt; <span id="bc"></span></div>
<div class="detail" id="det"></div><section style="padding-top:50px"><div class="sec-h"><h2 style="font-size:28px">More to read</h2></div><div class="grid" id="more"></div></section></div>
<footer class="ft" id="ft"></footer>
<script src="app.js"></script><script>RB.init("shop");
var id=new URLSearchParams(location.search).get("id")||1,b=RB.book(id)||RB.book(1);document.title=b.t+" - Rainbow Books";document.getElementById("bc").textContent=b.t;
document.getElementById("det").innerHTML='<div>'+RB.cover(b,"lg")+'</div><div><h1 style="font-size:42px">'+RB.esc(b.t)+'</h1><div style="color:var(--mute);margin:6px 0 14px;font-size:18px">by '+RB.esc(b.a)+'</div><div>'+'<span class="tag">'+b.c+'</span>'+(b.pub?'<span class="tag s">Rainbow Publishing</span>':'')+'</div><p style="margin:18px 0;max-width:560px">'+RB.esc(b.d)+'</p>'+
'<div class="box" style="max-width:480px"><div class="field"><label>Format</label><div class="radios"><label style="margin:0;color:var(--ink)"><input type="radio" name="f" value="Paperback" checked>Paperback '+RB.money(b.p)+'</label><label style="margin:0;color:var(--ink)"><input type="radio" name="f" value="E-book">E-book '+RB.money(b.e)+'</label></div></div>'+
'<div class="field"><label>How many?</label><div class="step"><button type="button" id="mi" aria-label="Fewer">&minus;</button><span id="qn">1</span><button type="button" id="pl" aria-label="More">+</button></div></div>'+
'<div class="field"><label for="st">Check stock in a store</label><select id="st"><option value="">Choose a store</option>'+RB.STORES.map(function(s,i){return '<option value="'+i+'">'+s.n+'</option>'}).join("")+'</select><div id="sk" style="font-size:14px;margin-top:6px;color:var(--mute)"></div></div>'+
'<button class="btn go" id="ad" style="width:100%">Add to cart</button></div></div>';
var q=1;document.getElementById("mi").onclick=function(){q=Math.max(1,q-1);document.getElementById("qn").textContent=q};document.getElementById("pl").onclick=function(){q=Math.min(20,q+1);document.getElementById("qn").textContent=q};
document.getElementById("ad").onclick=function(){RB.add(b.id,document.querySelector("input[name=f]:checked").value,q)};
document.getElementById("st").onchange=function(){var v=this.value,e=document.getElementById("sk");if(v==="")return e.textContent="";var n=(b.id*3+Number(v)*5)%9;e.innerHTML=n>2?'<span class="tag s">In stock</span> '+n+' on the shelf':n>0?'<span class="tag">Low stock</span> only '+n+' left':'<span class="tag" style="background:#fde5df;color:#a8341b">Out of stock</span> we can order it in'};
document.getElementById("more").innerHTML=RB.BOOKS.filter(function(x){return x.id!=b.id&&x.c==b.c}).concat(RB.BOOKS.filter(function(x){return x.id!=b.id&&x.c!=b.c})).slice(0,4).map(RB.card).join("");RB.bindAdd();</script></body></html>
