<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - Rainbow Books</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hd" id="hd"></header>

<div class="page-h"><div class="wrap"><h1>Checkout</h1><p>Tell us who you are and how you would like to pay.</p></div></div>
<form class="wrap cols" id="f" style="padding-top:30px" novalidate>
<div><div class="box" style="margin-bottom:22px"><h2>Your details</h2><div class="row"><div class="field"><label for="fn">Full name</label><input id="fn" type="text" required autocomplete="name"></div><div class="field"><label for="em">Email</label><input id="em" type="email" required autocomplete="email"></div></div><div class="field"><label for="ph">Mobile</label><input id="ph" type="tel" autocomplete="tel"></div></div>
<div class="box" id="addr" style="margin-bottom:22px"><h2>Delivery address</h2><div class="field"><label for="ad">Street address</label><input id="ad" type="text" autocomplete="street-address"></div><div class="row"><div class="field"><label for="sb">Suburb</label><input id="sb" type="text"></div><div class="field"><label for="pc">Postcode</label><input id="pc" type="text" inputmode="numeric" maxlength="4"></div></div></div>
<div class="box"><h2>Payment</h2><div class="note">This is a prototype. No payment is taken, and nothing you type here is sent or stored.</div>
<div class="field"><label>Pay with</label><div class="radios"><label style="margin:0;color:var(--ink)"><input type="radio" name="pm" value="card" checked>Credit or debit card</label><label style="margin:0;color:var(--ink)"><input type="radio" name="pm" value="paypal">PayPal</label><label style="margin:0;color:var(--ink)"><input type="radio" name="pm" value="gift">Gift card</label></div></div>
<div id="cardf"><div class="field"><label for="cn">Card number</label><input id="cn" type="text" inputmode="numeric" placeholder="0000 0000 0000 0000" autocomplete="off"></div><div class="row"><div class="field"><label for="cx">Expiry</label><input id="cx" type="text" placeholder="MM/YY" autocomplete="off"></div><div class="field"><label for="cv">Security code</label><input id="cv" type="text" placeholder="123" maxlength="4" autocomplete="off"></div></div></div>
<div class="field"><label><input type="checkbox" id="nl">Email me about new books and events</label></div></div></div>
<div><div class="slip"><h2>Your order</h2><div id="ol"></div><div class="sum"><span>Books</span><span id="s1"></span></div><div class="sum"><span>Delivery</span><span id="s2"></span></div><div class="sum t"><span>Total</span><span id="s3"></span></div><div id="err" class="note" style="display:none;background:#fde5df;border-color:var(--red)"></div><button class="btn go" type="submit" style="width:100%;margin-top:10px">Place order</button><a href="cart.html" style="display:block;text-align:center;margin-top:12px;font-size:14px">Back to cart</a></div></div></form>
<footer class="ft" id="ft"></footer>
<script src="app.js"></script><script>RB.init("");
var c=RB.cart();if(!c.length)location.href="cart.html";var o=RB.get("rb_opt",{dl:"post",st:""}),t=RB.get("rb_total",{sub:0,ship:0});
document.getElementById("ol").innerHTML=c.map(function(l){var b=RB.book(l.id);return '<div class="sum"><span>'+l.q+' &times; '+RB.esc(b.t)+' <span style="color:var(--mute);font-size:13px">('+l.f+')</span></span><span>'+RB.money(RB.price(l)*l.q)+'</span></div>'}).join("");
document.getElementById("s1").textContent=RB.money(t.sub);document.getElementById("s2").textContent=t.ship?RB.money(t.ship):"Free";document.getElementById("s3").textContent=RB.money(t.sub+t.ship);
var phys=c.some(function(l){return l.f=="Paperback"}),post=o.dl=="post"&&phys;document.getElementById("addr").style.display=post?"block":"none";
document.querySelectorAll("input[name=pm]").forEach(function(e){e.onchange=function(){document.getElementById("cardf").style.display=document.querySelector("input[name=pm]:checked").value=="card"?"block":"none"}});
document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var m=[];if(!document.getElementById("fn").value.trim())m.push("your name");if(!/.+@.+\..+/.test(document.getElementById("em").value))m.push("a valid email");if(post&&!document.getElementById("ad").value.trim())m.push("your street address");
var e=document.getElementById("err");if(m.length){e.style.display="block";e.textContent="Please add "+m.join(", ")+" before placing your order.";return}
var n="RB-"+(30000+Math.floor(Math.random()*9000));RB.set("rb_order",{n:n,name:document.getElementById("fn").value,lines:c,sub:t.sub,ship:t.ship,dl:o.dl,st:o.st,post:post,email:document.getElementById("em").value});RB.saveCart([]);location.href="confirmation.html"}</script></body></html>
